[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgui_lab4_interface"
version = "0.1.0"
description = "PML desktop window for moving data onto BioHPC storage, attaching Lab4 metadata and registering recordings."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flynn OConnell", email = "flynnoconnell@gmail.com" }]
dependencies = [
    "imgui-bundle==1.92.801",
    "h5py==3.16.0",
    "imgui-data-loader==0.2.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
lab4 = "imgui_lab4_interface.app:run"
lab4-scan = "imgui_lab4_interface.catalog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
