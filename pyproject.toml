[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgui_lab4_interface"
version = "0.1.0"
description = "PML desktop window for moving data onto BioHPC storage and attaching Lab4 metadata to it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flynn OConnell", email = "flynnoconnell@gmail.com" }]
dependencies = [
    "imgui-bundle==1.92.801",
    "imgui-data-loader==0.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
lab4 = "imgui_lab4_interface.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
