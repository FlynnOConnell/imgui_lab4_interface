name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # imgui_bundle links against these even on the null backend the headless tests use
      - run: sudo apt-get update && sudo apt-get install -y libx11-6 libxext6
      - run: uv run pytest -ra
